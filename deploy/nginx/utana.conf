# Production site for the allowlisted static artifact built by
# scripts/build-public.sh and deployed to /var/www/utana/public.

# Current asset names are not content-hashed, even when a query-string version is
# present, so they receive only a short cache lifetime. This long-lived policy is
# reserved for future filenames containing a hexadecimal content hash.
map $uri $utana_cache_control {
    ~*\.html$                                                        "no-cache";
    "~*\.[0-9a-f]{8,}\.(?:avif|css|gif|jpe?g|js|png|svg|webp|woff2?)$" "public, max-age=31536000, immutable";
    default                                                          "public, max-age=3600, must-revalidate";
}

# Port 80 is also the ACME webroot. All other traffic is sent to the fixed
# canonical hostname, never to a value derived from the request Host header.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name utana.agentic.technologies www.utana.agentic.technologies _;

    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://utana.agentic.technologies$request_uri;
    }
}

# Catch the supported www alias (and unmatched HTTPS Host headers after TLS) and
# redirect it without exposing the artifact. The certificate must contain both
# utana.agentic.technologies and www.utana.agentic.technologies SANs.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.utana.agentic.technologies _;

    ssl_certificate /etc/letsencrypt/live/utana.agentic.technologies/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utana.agentic.technologies/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:UtanaSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://utana.agentic.technologies$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name utana.agentic.technologies;

    root /var/www/utana/public;
    index index.html;
    autoindex off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    etag on;

    ssl_certificate /etc/letsencrypt/live/utana.agentic.technologies/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utana.agentic.technologies/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:UtanaSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; connect-src 'none'; font-src https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $utana_cache_control always;

    # HSTS is intentionally absent. Enable it only after the canonical and www
    # DNS records, certificate renewal, and all HTTPS redirects are verified in
    # production. Do not add includeSubDomains until every subdomain is HTTPS-only.

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = / {
        try_files /index.html =404;
    }

    # Ticket 02's historical aliases are HTTP 301s at the server layer. The
    # redirect stub files remain excluded from the public artifact.
    location = /use-cases/dentsu-media.html {
        return 301 https://utana.agentic.technologies/use-cases/marketing-production.html$is_args$args;
    }
    location = /use-cases/kpn-proposals.html {
        return 301 https://utana.agentic.technologies/use-cases/sales-proposals.html$is_args$args;
    }
    location = /use-cases/lumen-sales.html {
        return 301 https://utana.agentic.technologies/use-cases/sales-enquiries.html$is_args$args;
    }
    location = /use-cases/microsoft-campaigns.html {
        return 301 https://utana.agentic.technologies/use-cases/marketing-production.html$is_args$args;
    }
    location = /use-cases/morgan-stanley-knowledge.html {
        return 301 https://utana.agentic.technologies/use-cases/employee-requests.html$is_args$args;
    }
    location = /use-cases/oscar-claims.html {
        return 301 https://utana.agentic.technologies/use-cases/clinic-administration.html$is_args$args;
    }
    location = /use-cases/retailer-invoices.html {
        return 301 https://utana.agentic.technologies/use-cases/document-operations.html$is_args$args;
    }
    location = /use-cases/thyssenkrupp-engineering.html {
        return 301 https://utana.agentic.technologies/use-cases/restaurant-operations.html$is_args$args;
    }

    # Deny repository metadata, dotfiles, local documentation, editor remnants,
    # backups, and logs even if one is accidentally copied under the web root.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }
    location ~* (?:^|/)(?:\.git|\.hg|\.svn|CVS)(?:/|$) {
        deny all;
    }
    location ~* (?:^|/)(?:CHANGELOG|LICENSE|README)(?:\.[^/]*)?$ {
        deny all;
    }
    location ~* (?:~|\.(?:bak|backup|log|old|orig|save|sw[op]|temp|tmp))$ {
        deny all;
    }

    # Only the site root has an index. Directory URLs and extensionless routes
    # are not part of the canonical URL contract established by ticket 02.
    location ~ /$ {
        return 404;
    }
    location / {
        try_files $uri =404;
    }
}
