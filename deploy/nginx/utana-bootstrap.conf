# Temporary HTTP-only configuration used to obtain the first certificate.
# Remove this site before enabling utana.conf; never enable both together.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name utana.agentic.technologies www.utana.agentic.technologies _;

    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://utana.agentic.technologies$request_uri;
    }
}
